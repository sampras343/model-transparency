name: Conformance

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 8 * * 1,4'  # Mon/Thu 8 AM UTC
  workflow_dispatch:

permissions: {}

jobs:
  conformance:
    name: Run OMS conformance suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # for sigstore OIDC

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install model-signing from source
        run: pip install .

      - uses: sampras343/model-signing-conformance@main
        with:
          entrypoint: ${{ github.workspace }}/test/conformance/python-conformance
          skip-result-upload: 'true'

      - name: Upload conformance report
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: conformance-report.json
          if-no-files-found: warn
