name: Conformance

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 8 * * 1,4'  # Mon/Thu 8 AM UTC
  workflow_dispatch:

permissions: {}

jobs:
  conformance:
    name: Run OMS conformance suite
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install model-signing from source
        run: pip install .

      - name: Install conformance suite dependencies
        run: pip install pytest pytest-json-report

      - name: Checkout model-signing-conformance
        uses: actions/checkout@v4
        with:
          repository: sampras343/model-signing-conformance
          path: conformance-suite

      - name: Run conformance suite
        run: python conformance-suite/action.py
        env:
          INPUT_ENTRYPOINT: ${{ github.workspace }}/test/conformance/python-conformance

      - name: Upload conformance report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-report
          path: conformance-report.json
          if-no-files-found: warn
